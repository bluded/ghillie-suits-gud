# Builds the mod and publishes a GitHub release whenever a version tag is pushed:
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# The tag has to match VERSION in package.py, or the build fails.
#
# The release gets the zip attached and auto-generated notes from merged PRs.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create the release and upload the zip

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package
        run: python package.py --safe-name --version "${GITHUB_REF_NAME}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Ghillie Suits Gud ${{ github.ref_name }}
          files: dist/*.zip
          generate_release_notes: true
